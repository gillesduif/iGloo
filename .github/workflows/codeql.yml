name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Catches advisories published after the last commit.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Same runner as CI: WPF and net9.0-windows do not build elsewhere.
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Explicit build, not autobuild: the solution needs both SDKs pinned above.
      - name: Build
        run: |
          dotnet restore Igloo.sln
          dotnet build Igloo.sln -c Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          output: sarif-results
          upload: failure-only

      # paths-ignore does nothing for compiled languages - CodeQL analyses whatever the
      # build produced, including the XAML compiler and source-generator output under
      # obj/. github/codeql#5618 has been open since 2021, so the SARIF is filtered
      # instead. Patterns match the paths as they appear in the SARIF, not in git.
      - name: Drop generated code from the results
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            +**/*
            -**/obj/**
            -**/*.g.cs
            -**/*.g.i.cs
          input: sarif-results/csharp.sarif
          output: sarif-results/csharp.sarif

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/csharp.sarif
          category: /language:csharp
