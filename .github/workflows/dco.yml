name: DCO

on:
  pull_request:
    branches: [ main ]

jobs:
  signed-off-by:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No third-party action: this runs on every contributor's commits.
      - name: Check every commit carries a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              continue
            fi
            echo "::error::$sha $(git log -1 --format=%s "$sha") - no Signed-off-by line"
            missing=$((missing + 1))
          done
          if [ "$missing" -gt 0 ]; then
            echo "$missing commit(s) without a sign-off. Add one with: git commit -s --amend"
            echo "See CONTRIBUTING.md for the DCO."
            exit 1
          fi
          echo "All commits signed off."
