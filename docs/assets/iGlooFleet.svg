<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="30 50 620 620"
   role="img"
   version="1.1"
   id="svg72"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title1">iGloo logo</title>
  <desc id="desc1">Skeuomorphic 3D igloo: left half classic ice-block dome, right half a modern glass office facade, with a rounded entrance and glass doors.</desc>
  <defs id="defs28">
    <radialGradient id="dome" cx="207.06353" cy="278.75194" r="344.88815"
       gradientTransform="matrix(1.2247449,0,0,0.81649658,4.6280992,23.140496)"
       fx="207.06353" fy="278.75194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" id="stop1" />
      <stop offset="14%" stop-color="#f2f8fd" id="stop2" />
      <stop offset="38%" stop-color="#cde0ee" id="stop3" />
      <stop offset="68%" stop-color="#83a4c2" id="stop4" />
      <stop offset="100%" stop-color="#3e607e" id="stop5" />
    </radialGradient>

    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeaf6" id="gstop1" />
      <stop offset="30%" stop-color="#9dc0dd" id="gstop2" />
      <stop offset="62%" stop-color="#3f6f96" id="gstop3" />
      <stop offset="100%" stop-color="#1f3f5c" id="gstop4" />
    </linearGradient>

    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" id="gsstop1" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" id="gsstop2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" id="gsstop3" />
    </linearGradient>

    <linearGradient id="frameWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" id="fwstop1" />
      <stop offset="100%" stop-color="#d3e2ee" id="fwstop2" />
    </linearGradient>

    <linearGradient id="doorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d6f95" id="dgstop1" />
      <stop offset="45%" stop-color="#1c3c58" id="dgstop2" />
      <stop offset="100%" stop-color="#0c2136" id="dgstop3" />
    </linearGradient>

    <linearGradient id="doorHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" id="dhstop1" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0" id="dhstop2" />
    </linearGradient>

    <radialGradient id="gshad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.4" id="stop13" />
      <stop offset="55%" stop-color="#000" stop-opacity="0.12" id="stop14" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" id="stop15" />
    </radialGradient>
    <radialGradient id="snow" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" id="stop16" />
      <stop offset="100%" stop-color="#bcd2e2" id="stop17" />
    </radialGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" id="stop18" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22" id="stop19" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" id="stop20" />
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" id="stop21" />
      <stop offset="75%" stop-color="#fff" stop-opacity="0" id="stop22" />
      <stop offset="92%" stop-color="#7099bd" stop-opacity="0.35" id="stop23" />
      <stop offset="100%" stop-color="#3a5c80" stop-opacity="0.55" id="stop24" />
    </linearGradient>

    <!-- Full dome outline (ice + glass together), used for rim shading -->
    <path id="domeOutline" d="M 95 515 A 245 325 0 0 1 585 515 Z" />

    <!-- Left ice-block region (perfectly centered 50/50 split) -->
    <path id="iceRegion"
       d="M 95 515 A 245 325 0 0 1 340 190 L 340 515 L 95 515 Z" />

    <!-- Right glass-facade region -->
    <path id="glassRegion"
       d="M 340 190 A 245 325 0 0 1 585 515 L 340 515 Z" />

    <clipPath id="iceClip"><use xlink:href="#iceRegion" /></clipPath>
    <clipPath id="glassClip"><use xlink:href="#glassRegion" /></clipPath>
    <clipPath id="domeClip"><use xlink:href="#domeOutline" /></clipPath>
    <clipPath id="entranceClip">
      <path d="M 285 525 L 285 480 A 55 42 0 0 1 395 480 L 395 525 Z" />
    </clipPath>
  </defs>

  <!-- ground shadow + snow -->
  <ellipse cx="340" cy="540" rx="295" ry="34" fill="url(#gshad)" id="ellipse28" />
  <ellipse cx="340" cy="520" rx="285" ry="22" fill="url(#snow)" opacity="0.75" id="ellipse29" />

  <!-- LEFT: ice-block dome -->
  <use xlink:href="#iceRegion" fill="url(#dome)" />
  <g clip-path="url(#iceClip)" fill="none" stroke="#385976" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
    <path d="m 95,442 q 245,-12 490,0" />
    <path d="m 105,392 q 235,-14 470,0" />
    <path d="m 120,347 q 220,-17 440,0" />
    <path d="m 142,305 q 198,-19 396,0" />
    <path d="m 170,268 q 170,-21 340,0" />
    <path d="m 205,233 q 135,-22 270,0" />
    <path d="m 245,205 q 95,-19 190,0" />
    <path d="m 285,185 q 55,-12 110,0" />
    <line x1="155" y1="490" x2="153" y2="441" />
    <line x1="220" y1="490" x2="218" y2="434" />
    <line x1="295" y1="490" x2="293" y2="430" />
    <line x1="390" y1="490" x2="392" y2="430" />
    <line x1="180" y1="438" x2="178" y2="391" />
    <line x1="258" y1="431" x2="256" y2="383" />
    <line x1="345" y1="428" x2="345" y2="380" />
    <line x1="205" y1="389" x2="203" y2="345" />
    <line x1="290" y1="380" x2="288" y2="337" />
    <line x1="395" y1="380" x2="397" y2="337" />
    <line x1="232" y1="342" x2="230" y2="302" />
    <line x1="312" y1="332" x2="310" y2="293" />
    <line x1="262" y1="298" x2="260" y2="263" />
    <line x1="340" y1="285" x2="340" y2="252" />
    <line x1="292" y1="260" x2="290" y2="229" />
    <line x1="320" y1="225" x2="318" y2="201" />
  </g>

  <!-- RIGHT: glass office facade -->
  <use xlink:href="#glassRegion" fill="url(#glassBg)" />
  <g clip-path="url(#glassClip)">
    <!-- horizontal floor bands -->
    <rect x="280" y="240" width="360" height="10" fill="url(#frameWhite)" />
    <rect x="280" y="316" width="360" height="12" fill="url(#frameWhite)" />
    <rect x="280" y="398" width="360" height="12" fill="url(#frameWhite)" />
    <rect x="280" y="478" width="360" height="10" fill="url(#frameWhite)" />
    <!-- vertical mullions -->
    <g stroke="#eef5fb" stroke-width="4" opacity="0.9">
      <line x1="352" y1="190" x2="352" y2="515" />
      <line x1="392" y1="190" x2="392" y2="515" />
      <line x1="432" y1="205" x2="432" y2="515" />
      <line x1="472" y1="222" x2="472" y2="515" />
      <line x1="512" y1="248" x2="512" y2="515" />
      <line x1="552" y1="285" x2="552" y2="515" />
    </g>
    <!-- faint abstract interior/reflection marks -->
    <g fill="#0c2136" opacity="0.18">
      <rect x="392" y="335" width="14" height="55" />
      <rect x="432" y="345" width="10" height="45" />
      <rect x="472" y="418" width="12" height="50" />
      <rect x="512" y="345" width="12" height="45" />
    </g>
    <!-- glass sheen streaks -->
    <polygon points="320,215 358,215 420,515 375,515" fill="url(#glassSheen)" />
    <polygon points="440,210 470,210 518,515 483,515" fill="url(#glassSheen)" opacity="0.6" />
  </g>

  <!-- unified rim shading over both halves -->
  <use xlink:href="#domeOutline" fill="url(#rim)" />

  <!-- white seam strip marking the ice-to-glass transition, centered -->
  <g clip-path="url(#domeClip)">
    <rect x="332" y="180" width="16" height="345" fill="url(#frameWhite)" />
    <line x1="332" y1="180" x2="332" y2="525" stroke="#a9c4da" stroke-width="1" opacity="0.7" />
    <line x1="348" y1="180" x2="348" y2="525" stroke="#a9c4da" stroke-width="1" opacity="0.7" />
  </g>

  <!-- ice specular highlights -->
  <ellipse cx="200" cy="270" rx="60" ry="102" fill="url(#spec)" opacity="0.8" transform="rotate(-18 200 270)" />
  <ellipse cx="198" cy="232" rx="13" ry="25" fill="#ffffff" opacity="0.85" transform="rotate(-22 198 232)" />
  <ellipse cx="192" cy="219" rx="6" ry="10" fill="#ffffff" opacity="1" transform="rotate(-22 192 219)" />

  <!-- entrance arch frame -->
  <path d="M 245 525 L 245 465 A 95 65 0 0 1 435 465 L 435 525 Z" fill="url(#frameWhite)" />
  <path d="M 245 525 L 245 465 A 95 65 0 0 1 435 465 L 435 525 Z" fill="url(#rim)" opacity="0.5" />

  <!-- glass double doors -->
  <path d="M 285 525 L 285 480 A 55 42 0 0 1 395 480 L 395 525 Z" fill="url(#doorGlass)" />
  <g clip-path="url(#entranceClip)">
    <polygon points="290,525 315,480 335,480 305,525" fill="url(#doorHighlight)" />
    <line x1="340" y1="480" x2="340" y2="525" stroke="#0a1c30" stroke-width="2.5" />
    <line x1="288" y1="500" x2="392" y2="500" stroke="#274b6b" stroke-width="1" opacity="0.6" />
    <rect x="326" y="497" width="4" height="24" rx="2" fill="#e7f0f7" />
    <rect x="350" y="497" width="4" height="24" rx="2" fill="#e7f0f7" />
  </g>
  <path d="M 285 525 L 285 480 A 55 42 0 0 1 395 480 L 395 525 Z" fill="none" stroke="#c9dbe9" stroke-width="2" opacity="0.6" />
</svg>
