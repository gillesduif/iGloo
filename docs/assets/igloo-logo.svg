<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" role="img">
<title>Igloo logo</title>
<desc>Skeuomorphic 3D igloo with ice-block texture and a dark entrance tunnel</desc>

<defs>
  <radialGradient id="dome" cx="32%" cy="18%" r="88%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="14%" stop-color="#f2f8fd"/>
    <stop offset="38%" stop-color="#cde0ee"/>
    <stop offset="68%" stop-color="#83a4c2"/>
    <stop offset="100%" stop-color="#3e607e"/>
  </radialGradient>

  <radialGradient id="tunnel" cx="42%" cy="20%" r="95%">
    <stop offset="0%" stop-color="#f4f9fd"/>
    <stop offset="28%" stop-color="#d2e2ee"/>
    <stop offset="65%" stop-color="#85a5c2"/>
    <stop offset="100%" stop-color="#3a587a"/>
  </radialGradient>

  <radialGradient id="entrance" cx="50%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#02060e"/>
    <stop offset="55%" stop-color="#0a1c30"/>
    <stop offset="100%" stop-color="#1c3852"/>
  </radialGradient>

  <radialGradient id="gshad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000" stop-opacity="0.4"/>
    <stop offset="55%" stop-color="#000" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="snow" cx="50%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#bcd2e2"/>
  </radialGradient>

  <radialGradient id="spec" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="rim" x1="0%" y1="50%" x2="100%" y2="50%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="75%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="92%" stop-color="#7099bd" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#3a5c80" stop-opacity="0.55"/>
  </linearGradient>

  <radialGradient id="innerShadow" cx="50%" cy="50%" r="55%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="90%" stop-color="#000" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
  </radialGradient>

  <clipPath id="domeClip">
